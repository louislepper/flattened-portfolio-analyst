openapi: 3.0.3
info:
  title: Flattened Portfolio Analyst API
  description: >
    API for fetching security data including composite securities
    (ETFs/funds) with their underlying holdings.
  version: 1.0.0

servers:
  - url: /api/v1

paths:
  /securities/{ticker}:
    get:
      summary: Get security data by ticker
      description: >
        Returns security data including price, tags, and composite
        securities (underlying holdings for ETFs/funds).
      operationId: getSecurity
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
          description: The stock or ETF ticker symbol
          example: GOOG
        - name: X-Firebase-AppCheck
          in: header
          required: false
          schema:
            type: string
          description: >
            Firebase App Check (reCAPTCHA v3) token identifying the request as
            coming from the real frontend. Only verified when the backend has
            App Check enforcement enabled; rejected requests receive a 401.
        - name: X-Price-Refresh
          in: header
          required: false
          schema:
            type: string
            enum: [skip]
          description: >
            Set to `skip` to serve the stored price without attempting a
            Finnhub refresh, even if the price is stale or missing. The client
            sends this for ETF constituent lookups so the rate-limited Finnhub
            budget is reserved for the securities the user actually holds.
            Responses for securities that have never been priced (price 0) are
            served with `Cache-Control: no-store`.
      responses:
        "200":
          description: Security data retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityResponse"
        "401":
          description: Missing or invalid App Check token (when enforcement is enabled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >
            Security not found. Publicly cacheable for one day
            (`Cache-Control: public, max-age=86400`), so a ticker added by a
            later data refresh becomes visible within a day.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    SecurityTag:
      type: object
      required:
        - key
        - name
        - value
      properties:
        key:
          type: string
          description: Machine-readable tag identifier
          example: market_cap
        name:
          type: string
          description: Human-readable tag display name
          example: Market Capitalisation
        value:
          type: string
          description: The tag value for this security
          example: Large Cap

    CompositeSecurity:
      type: object
      required:
        - ticker
        - percentage
        - refreshedAt
      properties:
        ticker:
          type: string
          description: Ticker of the underlying security
          example: GOOG
        percentage:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: >
            Fraction of the parent security's value allocated to
            this underlying holding (0 to 1)
          example: 0.2
        refreshedAt:
          type: string
          format: date-time
          description: >
            Timestamp when this composite security entry
            was last updated
          example: "2026-03-01T12:00:00Z"
        kind:
          type: string
          enum:
            - equity
            - non-equity
            - unresolved
          description: >
            How the data pipeline classified this constituent. Only `equity`
            constituents have a security document to look up; `non-equity`
            (bonds, cash, futures, derivatives) and `unresolved` entries keep
            the raw provider string as `ticker`, which may collide with an
            unrelated security's ticker. Absent on documents written before
            the field existed; clients treat a missing kind as `equity`.
          example: equity

    SecurityResponse:
      type: object
      required:
        - ticker
        - type
        - tags
        - price
        - compositeSecurities
        - refreshedAt
      properties:
        ticker:
          type: string
          description: The security ticker symbol
          example: GOOG
        type:
          type: string
          enum:
            - stock
            - etf
          description: >
            Whether this security is a simple stock or a composite
            security (ETF/fund) containing underlying holdings.
          example: stock
        tags:
          type: array
          items:
            $ref: "#/components/schemas/SecurityTag"
        price:
          type: number
          description: Current price in cents
          example: 15000
        refreshedAt:
          type: string
          format: date-time
          description: >
            Timestamp when the price and composite security
            proportions were last refreshed
          example: "2026-03-01T12:00:00Z"
        compositeSecurities:
          type: array
          items:
            $ref: "#/components/schemas/CompositeSecurity"
          description: >
            Underlying holdings for composite securities
            (ETFs/funds). The percentages of securities may not add to 100% if some of our data is missing.
            If compositeSecurities is empty, it means we don't know the proportions / underlying securities of this ETF.

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code
          example: NOT_FOUND
        message:
          type: string
          description: Human-readable error message
          example: Security with ticker XYZ not found
