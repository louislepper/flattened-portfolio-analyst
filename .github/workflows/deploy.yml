name: CI / Deploy to staging

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/build.yml
    with:
      # PR builds use the staging config so the bundle is representative.
      environment: staging

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    uses: ./.github/workflows/firebase-deploy.yml
    with:
      environment: staging
      firebase_project: staging
